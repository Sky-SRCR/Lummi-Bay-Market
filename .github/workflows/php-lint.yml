name: PHP lint and self-test

# There is no deploy pipeline for this app — every change reaches the sign by hand.
# This is the cheap insurance: a syntax error in a file that only runs on the live
# server is caught here instead of on the sign, and the layout self-test guards the
# publish path, which can empty every Display at once.
#
# What this used to be: `php -l` and the self-test, on PHP 8.2, on SQLite.
#
# Decision #51 had two halves. One was "CI pins 8.2 against a 7.1 target". That half
# is closed twice over. The store owner stated the host runs 8.2 (2026-08-10), and on
# 2026-08-11 it was *observed*: 8.2.33 on cPanel's runtime card, and `ea-php82` pinned
# explicitly to srcresort.com in MultiPHP Manager against a system default of 8.3
# (BUILD-REFERENCE §4k, HANDOFF §7). The pin being explicit rather than `inherit` is
# the part that matters here — the floor does not drift when the host upgrades its
# default. So this leg tests the version the shop runs, not a version somebody hopes
# it runs, and ServerReport::phpVersionNote() remains the alarm for the one route left
# below the floor: a person choosing an older version by hand.
#
# This comment said "the version has still never been observed" until 2026-08-13, on
# the reasoning that the screen reporting it ships with the build that is undeployed on
# the sign and Cloudflare strips it from every response header. Both true, and neither
# was the only way to look: cPanel says it to whoever is signed in. Recorded because a
# stale note in the file that decides the floor is how a pin comes to be treated as a
# guess.
#
# The other half was real. CI ran neither the consistency greps nor the rehearsal,
# so three of the four things BUILD-REFERENCE §5 asks for before every push were
# things only a person could be relied on to do. All of them run here now, against
# both database engines.
#
# Running the suite on 7.1, while the target was still unknown, did find two ways the
# code misbehaves below PHP 8 — an array where a temp_id belongs is accepted rather
# than refused, and the error log never rotates. Neither is reachable on 8.x, so
# neither is reachable in this job. Both are fixed anyway, because a refusal that
# lives in a language version leaves when the host does. 7.1 is deliberately not a
# second matrix leg: with the floor at 8.2 that would test a version this app is not
# written for and is not run on.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest

    name: php ${{ matrix.php }} · mysql ${{ matrix.mysql }}

    strategy:
      fail-fast: false
      matrix:
        # The version the code is tested on, and as of 2026-08-11 the version the
        # host was read to be running: 8.2.33, with ea-php82 pinned explicitly.
        # That reading came from cPanel, which needs no deploy — Settings → This
        # Server reports the same figure from inside the app, in lbm-test/ today
        # and on the sign after the cutover. So this line has a fact to be checked
        # against rather than an assumption to hold; change it when they disagree.
        #
        # Note for anyone running the tools by hand on that host: cPanel Terminal
        # gives the *system* default PHP, which is 8.3 there, not this domain's pin.
        # /opt/cpanel/ea-php82/root/usr/bin/php is the one that matches CI.
        #
        # 8.3 and 8.4 are here for a different reason than 8.2, and it is worth being
        # clear which question each leg answers.
        #
        # 8.2 is the shop's runtime: this leg is the one that says the sign will work.
        # It stays first and it stays the version the floor names.
        #
        # 8.3 and 8.4 are the versions the sign is *going to* run on, and neither is
        # far off. PHP 8.2 leaves security support on 2026-12-31, so the pin this repo
        # relies on stops being a safe place to sit at the end of this year. The host's
        # system default is already 8.3 (§4k) and this domain is held back from it by
        # one explicit MultiPHP setting — so "the version changed" is a dropdown away,
        # not a migration. What made that worth a CI leg rather than a note is that
        # nothing in the app would say so: ServerReport::phpVersionNote() is silent at
        # and above the floor by design (a note read every time is a note learned to
        # skip), so it fires when the host goes *backwards* and never when it moves on.
        # These two legs are the thing that notices instead.
        #
        # They do not raise the floor. Invariant 31 still refuses 8.3+ syntax anywhere
        # in the tree, and it should: the floor is about what may be written, these
        # legs are about whether what *is* written still runs. A green 8.4 leg is not
        # permission to use 8.4 syntax, and the two would disagree loudly if it were.
        #
        # One thing these legs are for that the lint step cannot do, which is why they
        # are matrix legs rather than an extra `php -l`: a deprecation is emitted when a
        # file is compiled, not when it is parsed. `php -l lib/server_report.php` was
        # clean on 8.4 while the same file, included, emitted "Implicitly marking
        # parameter $server as nullable is deprecated" on every request that built the
        # report.
        #
        # This comment used to end "the steps that catch that are the ones that actually
        # run the code — the self-tests and the rehearsal, on each version", and that
        # was wrong in a way worth leaving on the record, because it is the shape of
        # mistake that keeps a gap open. Those steps do compile the file, so the notice
        # *is* emitted — and a notice is not a failure. The process exits 0, the leg goes
        # green, and on a runner whose `error_reporting` excludes `E_DEPRECATED` the line
        # is not even printed. Reintroducing the exact parameter above left `php -l`,
        # `check_invariants.php` and both self-test steps green. So this leg answers the
        # question only once something makes the answer visible, which is what the
        # `Deprecations` step below and invariant 33 were added to do.
        #
        # Two axes, and deliberately not their product. A full cross would be nine jobs,
        # most of them combinations nobody will ever run — the point of a leg is that
        # somebody can say which question it answers, and "PHP 8.4 on MySQL 5.7" is not
        # a question anyone here has. So the combinations are listed rather than
        # multiplied: PHP moves against the engine the shop has, and the engine moves
        # against the PHP the shop has.
        #
        # The MySQL axis exists for the same reason the 8.3 and 8.4 legs above do, one
        # layer down. 5.7 is what the shop runs — 5.7.23-23, per HANDOFF §7 — and it is
        # also **eight years old and out of support since October 2023**, so this is the
        # one version on this list whose replacement is not a question of if. Note that
        # the image is not the shop's build: `mysql:5.7` resolves to 5.7.44, the final
        # 5.7 release, twenty-one patch releases ahead of what the sign actually talks
        # to. The gate runs on a neighbour of the thing it speaks for — the same shape
        # as this container being PHP 8.4 while the floor is 8.2.
        #
        # 8.0 is where a host upgrading from 5.7 lands, and 8.4 is the current LTS —
        # the two ends of where the engine can go. Both are paired with 8.2, the shop's
        # PHP, so a failure on either is unambiguously the engine's doing.
        #
        # What these legs are *not* is permission to write 8.0-only SQL. Same rule as
        # the PHP legs: they say whether what is written still runs, not what may be
        # written. `schema.sql` is verified against 5.7 and stays that way.
        include:
          - { php: '8.2', mysql: '5.7' }   # the shop, today: this leg says the sign works
          - { php: '8.3', mysql: '5.7' }   # after the MultiPHP pin moves
          - { php: '8.4', mysql: '5.7' }   # and after it moves again
          - { php: '8.2', mysql: '8.0' }   # where a host upgrading off 5.7 lands
          - { php: '8.2', mysql: '8.4' }   # and the current LTS, which is where it stays

    services:
      mysql:
        # 5.7 matches the live server and is what schema.sql was verified against; the
        # other two are the upgrade path (see the matrix note above). Left on each
        # image's default authentication plugin on purpose — 8.0 and 8.4 default to
        # `caching_sha2_password`, which is what a host that upgrades will actually
        # hand the app, so making these legs pass by pinning them back to
        # `mysql_native_password` would be testing a configuration nobody will be in.
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lbm_selftest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # opcache for the deprecation sweep below: `opcache_compile_file()` is the
          # only way to compile a file without also running it.
          extensions: pdo, pdo_sqlite, pdo_mysql, opcache

      - name: Lint every PHP file
        run: |
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null || { php -l "$file"; status=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $status

      # The step above, asked again at compile time — where the answer is different. A
      # deprecation is emitted when a file is compiled and `php -l` never gets that far,
      # so both spellings of an implicitly nullable parameter lint clean on every
      # version. The self-tests below do compile the file and stay green anyway, because
      # emitting a notice is not failing a step: the process exits 0 either way. This is
      # what turns one into a red line, and the tool's docblock has the rest.
      #
      # Only on the newest leg. It reports what the engine *running it* deprecates, and
      # deprecations accumulate — 8.4 says everything 8.2 would and more — so asking the
      # other four legs would print a shorter list four more times. That is also the
      # difference between this and invariant 33: that one is a pattern and knows one
      # shape on every version, this is the engine's own answer and will report whatever
      # 8.5 adds without being taught it.
      - name: Deprecations on PHP ${{ matrix.php }}
        if: ${{ matrix.php == '8.4' }}
        run: php tools/check_deprecations.php

      # BUILD-REFERENCE §5's greps, run rather than described. Comment-aware, so
      # the modules that document the rules they enforce do not fail them.
      - name: Consistency checks
        run: php tools/check_invariants.php

      - name: Layout self-test — SQLite
        run: php tools/selftest_layout.php

      # The same suite against the engine the app runs on, where the publish
      # transaction's `SELECT … FOR UPDATE` is the real statement rather than the
      # stub SQLite needs (#48).
      - name: Layout self-test — MySQL
        env:
          SELFTEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=lbm_selftest;charset=utf8mb4'
          SELFTEST_MYSQL_USER: root
          SELFTEST_MYSQL_PASS: root
        run: php tools/selftest_layout.php

      # Against a database built from schema.sql, which is a fresh rebuild rather
      # than a copy of live data. That covers the real round trip — convergence,
      # both widened ENUMs, the cascade rules, publish-and-republish scoping, and
      # DDL committing an open transaction. What it cannot cover is converging a
      # database that *lags*, because schema.sql produces one that does not. That
      # case still needs a copy of the live database and is still a deploy-day
      # step in the roadmap's checklist.
      - name: Rehearsal against real MySQL
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS lbm_rehearsal; CREATE DATABASE lbm_rehearsal CHARACTER SET utf8mb4;"
          mysql -h 127.0.0.1 -uroot -proot lbm_rehearsal < schema.sql
          php tools/rehearse_phase1.php \
            --host=127.0.0.1 --port=3306 --db=lbm_rehearsal \
            --user=root --pass=root --confirm-copy

      # The numbering the documents run on. Cheap, and it catches a merge failure
      # nothing else here can see: two branches cut from the same base each take
      # the next free section letter, and git can merge two `### 4u.` headings
      # with no conflict marker, because they are not the same lines.
      #
      # Runs even when a step above it failed. It answers a question none of them
      # ask, and a run that stops at the self-test would skip it silently — during
      # exactly the window this exists for, since a red self-test on every branch
      # is what a shared broken base looks like and merging is what happens next.
      - name: Document numbering
        if: ${{ !cancelled() }}
        run: php tools/check_doc_numbering.php

  # builder.php is ~3400 lines of inline JavaScript that `php -l` cannot see, and
  # viewer.php is the page that runs unattended on a television. These six suites
  # run that JavaScript, each under a premise the others cannot hold: a DOM holding
  # only what a read-only page emits, a stubbed XMLHttpRequest driven through every
  # way an upload ends, a colour the CSSOM discards in silence, an admin working the
  # controls the inspector puts on a block, an admin taking back the last thing they
  # did, and a Screen whose server has stopped answering. Their own job because
  # they are the same JavaScript whichever PHP is installed.
  builder-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Builder self-test — read-only page
        run: node tools/selftest_builder_readonly.js

      - name: Builder self-test — uploads
        run: node tools/selftest_builder_uploads.js

      # #41: the CSSOM discards a colour it cannot parse without saying so, and the
      # publish payload turned that silence into black. Only visible by running it.
      - name: Builder self-test — colours
        run: node tools/selftest_builder_colors.js

      # #42: six inspector controls that quietly did less than they claimed. A
      # minimum measured in screen pixels, a Fit that could not fit, a section with
      # no way back from Hide — none of it a throw, all of it invisible to a parse.
      - name: Builder self-test — an ordinary good day
        run: node tools/selftest_builder_editing.js

      # ADR-0010: the one thing in this app that can be taken back, so the one place
      # a field a rebuild forgot to carry is a wrong canvas rather than a red line.
      # The central check is a whole-string round trip, which cannot be read.
      - name: Builder self-test — undo
        run: node tools/selftest_builder_undo.js

      # #26: the defect was not a throw. A `.catch` doing the right thing for a
      # dropped packet did the wrong thing for a failure that was never going to
      # stop, and a sign kept last week's prices. Only visible by running the poll
      # loop against a fetch the test controls.
      #
      # #45 is here for the same reason from the other end: nothing had ever *run*
      # the Viewer's renderers, so a block with no content had been explaining
      # itself to the customer through every gate this repo has. It parses.
      - name: Viewer self-test — the poll, and what a block with nothing in it draws
        run: node tools/selftest_viewer.js
